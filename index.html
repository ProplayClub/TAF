<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TAF — TREINOS</title>
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAF">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192-pp.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192-pp.png">

<style>
:root{
  --bg:#070707;
  --panel:#111;
  --panel2:#171717;
  --line:#2b2b2b;
  --text:#f4f4f4;
  --muted:#b7b7b7;
  --yellow:#ffd100;
  --yellow2:#ffec7a;
  --ok:#3ddc84;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#050505,#111);
  color:var(--text);
  min-height:100vh;
  text-transform:uppercase;
}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 120px}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(7,7,7,.97);
  backdrop-filter:blur(10px);padding:8px 0 10px
}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tab{
  border:1px solid #514500;
  background:linear-gradient(180deg,#241e00,#161200);
  color:var(--yellow2);
  border-radius:11px;
  padding:11px 4px;
  font-weight:900;
  font-size:.78rem;
  cursor:pointer
}
.tab.active{
  background:linear-gradient(180deg,#3ddc84,#21a85f);
  color:#07130c;
  border-color:#7ff0ad
}
.hero{
  margin-top:10px;
  background:linear-gradient(135deg,rgba(255,209,0,.13),rgba(255,209,0,.03) 35%,rgba(0,0,0,.2)),
             linear-gradient(180deg,#121212,#0c0c0c);
  border:1px solid #5a4a00;
  border-radius:18px;
  padding:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.35)
}
h1{margin:0 0 12px;font-size:1.8rem;line-height:1}
.progress{height:12px;border-radius:999px;background:#232323;overflow:hidden;border:1px solid #303030}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--yellow2));transition:.25s}
.progressText{margin-top:8px;color:var(--muted);font-size:.84rem}
.sectionTitle{
  margin:18px 2px 10px;
  font-size:.95rem;
  font-weight:900;
  color:var(--yellow);
  letter-spacing:.05em
}
.card{
  background:linear-gradient(180deg,#111,#0b0b0b);
  border:1px solid var(--line);
  border-left:4px solid var(--yellow);
  border-radius:16px;
  margin:10px 0;
  overflow:hidden
}
.cardTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
  padding:14px 14px 8px
}
.exerciseName{font-weight:900;font-size:1rem}
.target{color:var(--yellow2);font-size:.86rem;font-weight:800;margin-top:4px}
.loadBox{
  background:var(--panel2);
  border:1px solid #383838;
  border-radius:10px;
  display:flex;align-items:center;gap:6px;
  padding:6px 8px
}
.loadBox input{
  width:58px;background:transparent;border:none;color:var(--text);
  font-weight:900;text-align:center;font-size:1rem;outline:none
}
.loadBox span{color:var(--muted);font-size:.78rem}
.sets{padding:0 12px 12px;display:grid;gap:8px}
.setRow{
  display:grid;
  grid-template-columns:70px 1fr;
  gap:8px;align-items:center;
  background:var(--panel2);
  border:1px solid #2d2d2d;
  border-radius:12px;
  padding:8px
}
.setLabel{color:var(--muted);font-size:.8rem;font-weight:700}
.setBtn{
  border:1px solid #4a4a4a;
  background:#1a1a1a;
  color:var(--text);
  border-radius:9px;
  padding:10px 8px;
  font-weight:900;
  cursor:pointer
}
.setBtn.done{
  background:rgba(61,220,132,.14);
  border-color:var(--ok);
  color:#a7f1c5
}
.note{margin:0 14px 14px;color:var(--muted);font-size:.8rem}
.cardioCard{
  position:relative;
  background:linear-gradient(180deg,#151515,#0b0b0b);
  border:1px solid #4a430d;
  border-radius:16px;
  margin:22px 0 10px;
  padding:17px 15px 15px;
  overflow:hidden
}
.cardioCard::before{
  content:'';position:absolute;left:0;right:0;top:0;height:6px;
  background:linear-gradient(90deg,var(--yellow),var(--yellow2))
}
.cardioTitle{font-size:1rem;font-weight:950;color:var(--yellow);letter-spacing:.05em;margin-bottom:10px}
.cardioLine{font-size:.9rem;font-weight:800;line-height:1.55;color:var(--text)}
.cardioLine strong{color:var(--yellow2)}
.actions{display:flex;gap:8px;margin-top:14px}
.action{
  flex:1;
  border:1px solid #4b3f00;
  background:linear-gradient(180deg,#241e00,#151100);
  color:var(--yellow2);
  border-radius:12px;
  padding:12px;
  font-weight:900;
  cursor:pointer
}
.action.alt{
  color:#ffb2b2;
  border-color:#592929;
  background:linear-gradient(180deg,#241010,#150b0b)
}
.timerPanel{
  position:fixed;
  left:0;right:0;bottom:0;
  background:rgba(5,5,5,.98);
  backdrop-filter:blur(10px);
  border-top:1px solid #343434;
  z-index:60;
  padding:10px 12px
}
.timerInner{
  max-width:820px;margin:0 auto;
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;align-items:center
}
.timerMain{font-size:1.18rem;font-weight:900}
.timerMain small{display:block;color:var(--muted);font-size:.7rem;font-weight:600}
.tbtn{border:none;border-radius:11px;padding:11px 12px;font-weight:900;cursor:pointer}
.tbtn.dark{background:#232323;color:var(--text)}
.tbtn.yellow{background:linear-gradient(180deg,#3ddc84,#21a85f);color:#07130c}
@media (max-width:480px){
  .tabs{grid-template-columns:repeat(5,1fr)}
  .tab{font-size:.68rem;padding:10px 2px}
  .setRow{grid-template-columns:64px 1fr}
  .timerInner{grid-template-columns:1fr auto}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="tabs" id="tabs"></div></div>
  <div id="app"></div>
</div>

<div class="timerPanel">
  <div class="timerInner">
    <div class="timerMain"><span id="timer">02:00</span><small>INTERVALO</small></div>
    <button class="tbtn yellow" id="startBtn" onclick="toggleTimer()">INICIAR</button>
  </div>
</div>

<script>
const workouts = {
  A:{
    label:'TREINO A',
    exercises:[
      {id:'barra',icon:'',name:'BARRA FIXA LIVRE SUPINADA',target:'2×1',load:null,unit:'',sets:[1,1],rest:210,note:'INTERVALO: 3:30'},
      {id:'graviton_a_40',icon:'',name:'GRÁVITON SUPINADO',target:'4×3',load:40,unit:'KG',sets:[3,3,3,3],rest:210,note:'INTERVALO: 3:30'},
      {id:'puxada',icon:'',name:'PUXADA FRONTAL SUPINADA',target:'3×8',load:40,unit:'KG',sets:[8,8,8],rest:120,note:'INTERVALO: 2:00'},
      {id:'remada',icon:'',name:'REMADA ARTICULADA NEUTRA',target:'3×8',load:70,unit:'KG',sets:[8,8,8],rest:120,note:'INTERVALO: 2:00'},
      {id:'martelo',icon:'',name:'ROSCA MARTELO C/ HALTERES',target:'3×10',load:12,unit:'KG',sets:[10,10,10],rest:120,note:'INTERVALO: 2:00'}
    ],
    cardio:{
      title:'CARDIO — FINAL DO TREINO',
      lines:[
        '40–60 MIN CAMINHADA A <strong>5,7 KM/H</strong>'
      ]
    }
  },
  B:{
    label:'TREINO B',
    exercises:[
      {id:'hammer',icon:'',name:'SUPINO HAMMER ARTICULADO',target:'3×10',load:40,unit:'KG',sets:[10,10,10],rest:120,note:'INTERVALO: 2:00'},
      {id:'inclinado',icon:'',name:'SUPINO INCLINADO ARTICULADO',target:'3×10',load:40,unit:'KG',sets:[10,10,10],rest:120,note:'INTERVALO: 2:00'},
      {id:'triceps',icon:'',name:'TRÍCEPS PULLEY C/ BARRA',target:'3×10',load:50,unit:'KG',sets:[10,10,10],rest:120,note:'INTERVALO: 2:00'},
      {id:'abd',icon:'',name:'ABD SUPRA CROSS EM PÉ',target:'3×15',load:70,unit:'KG',sets:[15,15,15],rest:120,note:'INTERVALO: 2:00'},
      {id:'pallof',icon:'',name:'PALLOF PRESS NO CROSSOVER',target:'2×10 POR LADO',load:null,unit:'',sets:[10,10],rest:60,note:'INTERVALO: 1:00'}
    ],
    cardio:{
      title:'CARDIO — FINAL DO TREINO',
      lines:[
        'AQUECIMENTO <strong>8 MIN A 5,7 KM/H</strong>',
        'SÉRIES <strong>3×5 MIN A 9 KM/H</strong>',
        'RECUPERAÇÃO <strong>3 MIN CAMINHANDO A 5,5 KM/H</strong>'
      ]
    }
  },
  C:{
    label:'TREINO C',
    exercises:[
      {id:'barra',icon:'',name:'BARRA FIXA LIVRE SUPINADA',target:'2×1',load:null,unit:'',sets:[1,1],rest:210,note:'INTERVALO: 3:30'},
      {id:'graviton',icon:'',name:'GRÁVITON SUPINADO',target:'4×6',load:50,unit:'KG',sets:[6,6,6,6],rest:210,note:'INTERVALO: 3:30'},
      {id:'puxada',icon:'',name:'PUXADA FRONTAL SUPINADA',target:'3×8',load:40,unit:'KG',sets:[8,8,8],rest:120,note:'INTERVALO: 2:00'},
      {id:'desenv_halteres',icon:'',name:'DESENVOLVIMENTO COM HALTERES EM PEGADA NEUTRA',target:'3×10',load:10,unit:'KG',sets:[10,10,10],rest:120,note:'INTERVALO: 2:00'},
      {id:'crucifixo',icon:'',name:'CRUCIFIXO INVERSO CROSS UNILATERAL',target:'3×12',load:15,unit:'KG',sets:[12,12,12],rest:120,note:'INTERVALO: 2:00'}
    ],
    cardio:{
      title:'CARDIO — FINAL DO TREINO',
      lines:[
        '40–60 MIN CAMINHADA A <strong>5,7 KM/H</strong>'
      ]
    }
  },
  D:{
    label:'TREINO D',
    exercises:[
      {id:'leg',icon:'',name:'LEG PRESS 45°',target:'3×10',load:80,unit:'KG',sets:[10,10,10],rest:120,note:'INTERVALO: 2:00'},
      {id:'flexora',icon:'',name:'CADEIRA FLEXORA',target:'3×12',load:50,unit:'KG',sets:[12,12,12],rest:120,note:'INTERVALO: 2:00'},
      {id:'afundo',icon:'',name:'AFUNDO C/ HALTERES',target:'3×10 POR PERNA',load:12,unit:'KG',sets:[10,10,10],rest:120,note:'INTERVALO: 2:00'},
      {id:'pant',icon:'',name:'PANTURRILHA SENTADO MÁQUINA',target:'3×15',load:20,unit:'KG',sets:[15,15,15],rest:120,note:'INTERVALO: 2:00'}
    ],
    cardio:{
      title:'CARDIO — FINAL DO TREINO',
      lines:[
        'AQUECIMENTO <strong>8 MIN A 5,7 KM/H</strong>',
        'SÉRIE <strong>O MÁXIMO A 8 KM/H</strong>'
      ]
    }
  },
  S:{
    label:'SÁBADO',
    exercises:[
      {id:'barra2el',icon:'',name:'BARRA SUPINADA COM 2 ELÁSTICOS',target:'3×6',load:null,unit:'',sets:[6,6,6],rest:180,note:'INTERVALO: 3:00'},
      {id:'isoalto',icon:'',name:'ISOMETRIA NO ALTO',target:'2×15 S',load:null,unit:'',sets:[15,15],rest:120,note:'INTERVALO: 2:00'},
      {id:'iso90',icon:'',name:'ISOMETRIA A ~90°',target:'2×10 S',load:null,unit:'',sets:[10,10],rest:120,note:'INTERVALO: 2:00'},
      {id:'negativa',icon:'',name:'NEGATIVA SUPINADA',target:'2×1 DE 10 S',load:null,unit:'',sets:[1,1],rest:120,note:'INTERVALO: 2:00'},
      {id:'salto',icon:'',name:'IMPULSÃO HORIZONTAL',target:'2×2 M',load:null,unit:'',sets:[2,2],rest:120,note:'INTERVALO: 2:00'},
      {id:'abdctrl',icon:'',name:'ABDOMINAL CONTROLADO COM VASSOURA',target:'1×20',load:null,unit:'',sets:[20],rest:120,note:'INTERVALO: 2:00'}
    ]
  }
};

let current='A';
function storageKey(k){return 'taf_police_full_'+k;}

function buildTabs(){
  const host=document.getElementById('tabs');
  host.innerHTML='';
  ['A','B','C','D','S'].forEach(k=>{
    const b=document.createElement('button');
    b.className='tab'+(k===current?' active':'');
    b.textContent=workouts[k].label;
    b.onclick=()=>{saveState(current);current=k;render();window.scrollTo({top:0,behavior:'smooth'});};
    host.appendChild(b);
  });
}

function render(){
  buildTabs();
  const w=workouts[current];
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="hero">
      <h1>${w.label}</h1>
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div class="progressText" id="progressText">0% CONCLUÍDO</div>
    </div>
    <div class="sectionTitle">EXERCÍCIOS</div>
    <div id="exerciseHost"></div>
    <div id="cardioHost"></div>
    <div class="actions">
      <button class="action" onclick="saveState(current)">SALVAR</button>
      <button class="action alt" onclick="resetWorkout()">ZERAR ${w.label}</button>
    </div>
  `;
  const host=document.getElementById('exerciseHost');
  w.exercises.forEach(ex=>{
    const card=document.createElement('div');
    card.className='card';
    const loadHtml=ex.load===null?'':`
      <label class="loadBox">
        <input type="number" step="0.5" id="load-${ex.id}" value="${ex.load}" onchange="saveState(current)">
        <span>${ex.unit}</span>
      </label>`;
    card.innerHTML=`
      <div class="cardTop">
        <div>
          <div class="exerciseName">${ex.name}</div>
          <div class="target">${ex.target}</div>
        </div>
        ${loadHtml}
      </div>
      <div class="sets">
        ${ex.sets.map((rep,i)=>`
          <div class="setRow">
            <div class="setLabel">SÉRIE ${i+1}</div>
            <button class="setBtn" id="btn-${ex.id}-${i}" onclick="toggleSet('${ex.id}',${i},${ex.rest})">PRONTO</button>
          </div>
        `).join('')}
      </div>
      <div class="note">${ex.note}</div>
    `;
    host.appendChild(card);
  });
  const cardioHost=document.getElementById('cardioHost');
  if(w.cardio){
    cardioHost.innerHTML=`
      <div class="cardioCard">
        <div class="cardioTitle">${w.cardio.title}</div>
        ${w.cardio.lines.map(line=>`<div class="cardioLine">${line}</div>`).join('')}
      </div>
    `;
  }
  loadState(current);
  updateProgress();
}

function toggleSet(id,i,rest){
  const b=document.getElementById(`btn-${id}-${i}`);
  b.classList.toggle('done');
  const done=b.classList.contains('done');
  b.textContent=done?'PRONTO ✓':'PRONTO';
  if(done){
    setTimer(rest||120);
    startTimer();
  }
  saveState(current);
  updateProgress();
}

function updateProgress(){
  const all=[...document.querySelectorAll('.setBtn')];
  const done=all.filter(x=>x.classList.contains('done')).length;
  const total=all.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${pct}% CONCLUÍDO • ${done}/${total}`;
}

function saveState(k){
  const w=workouts[k], state={};
  w.exercises.forEach(ex=>{
    state[ex.id]={
      load: ex.load===null?null:document.getElementById(`load-${ex.id}`)?.value,
      sets: ex.sets.map((_,i)=>({
        done:document.getElementById(`btn-${ex.id}-${i}`)?.classList.contains('done')||false
      }))
    };
  });
  localStorage.setItem(storageKey(k),JSON.stringify(state));
}

function loadState(k){
  const raw=localStorage.getItem(storageKey(k));
  if(!raw)return;
  try{
    const s=JSON.parse(raw),w=workouts[k];
    w.exercises.forEach(ex=>{
      const item=s[ex.id];if(!item)return;
      if(ex.load!==null&&document.getElementById(`load-${ex.id}`))
        document.getElementById(`load-${ex.id}`).value=item.load??ex.load;
      ex.sets.forEach((_,i)=>{
        const st=item.sets?.[i];if(!st)return;
        const b=document.getElementById(`btn-${ex.id}-${i}`);
        if(st.done&&b){b.classList.add('done');b.textContent='PRONTO ✓';}
      });
    });
  }catch(e){}
}

function resetWorkout(){
  if(!confirm(`ZERAR TODAS AS MARCAÇÕES DO ${workouts[current].label}?`))return;
  localStorage.removeItem(storageKey(current));
  render();
}

let remaining=120,timerInt=null,running=false;
function renderTimer(){
  const m=String(Math.floor(remaining/60)).padStart(2,'0');
  const s=String(remaining%60).padStart(2,'0');
  document.getElementById('timer').textContent=`${m}:${s}`;
}
function setTimer(sec){remaining=sec;renderTimer();}
function startTimer(){
  if(timerInt)clearInterval(timerInt);
  running=true;
  document.getElementById('startBtn').textContent='PAUSAR';
  timerInt=setInterval(()=>{
    if(remaining>0){remaining--;renderTimer();}
    else{
      clearInterval(timerInt);timerInt=null;running=false;
      document.getElementById('startBtn').textContent='INICIAR';
      if(navigator.vibrate)navigator.vibrate([180,120,180]);
    }
  },1000);
}
function toggleTimer(){
  if(running){
    clearInterval(timerInt);timerInt=null;running=false;
    document.getElementById('startBtn').textContent='INICIAR';
  }else startTimer();
}

render();
renderTimer();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>

</body>
</html>
